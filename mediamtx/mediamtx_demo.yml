# mediamtx_demo.yml — vision-demo
# MediaMTX v1.16.2
#
# Start:  ./mediamtx mediamtx_demo.yml
#
# Streams (replace <jetson-ip> with your Nano's IP):
#
#   WebRTC (lowest latency):  http://<jetson-ip>:8889/<stream>
#   HLS    (most compatible): http://<jetson-ip>:8888/<stream>
#   RTSP   (VLC / ffplay):    rtsp://<jetson-ip>:8554/<stream>
#
# Available streams:
#   stereo_depth
#   optical_flow
#   yolo

logLevel: info
logDestinations: [stdout]

# activate RTSP by setting to true
rtsp: false
rtspAddress: :8554
rtspTransports: [tcp, udp]
rtspEncryption: "no"

rtmp: false
srt: false

# activate HLS by setting to true
hls: false
hlsAddress: :8888
hlsAlwaysRemux: true
hlsVariant: lowLatency
hlsSegmentCount: 7
hlsSegmentDuration: 1s
hlsPartDuration: 200ms
hlsAllowOrigins: ['*']

# IMPORTANT: advertise the Jetson's actual LAN IP as a WebRTC HOST ICE candidate.
#  -> webrtcAdditionalHosts: [IP]
# Without this, MediaMTX only advertises 127.0.0.1 and the browser has to
# discover the real IP via peer-reflexive (prflx) fallback -- causing a streaming delay.
# To find out the IP, run "ip a" command in terminal
webrtc: true
webrtcAddress: 10.42.0.149:8889
webrtcLocalUDPAddress: 10.42.0.149:8189
webrtcAdditionalHosts: [10.42.0.149]
webrtcIPsFromInterfaces: false
webrtcAllowOrigins: ['*']

# activate mediamtx API by setting to true
api: false
apiAddress: :9997

paths:

  stereo_depth:
    source: udp+rtp://127.0.0.1:5600
    rtpSDP: |
      v=0
      o=- 0 0 IN IP4 127.0.0.1
      s=stereo_depth
      c=IN IP4 127.0.0.1
      t=0 0
      m=video 5600 RTP/AVP 96
      a=rtpmap:96 H264/90000
      a=fmtp:96 packetization-mode=1

  optical_flow:
    source: udp+rtp://127.0.0.1:5601
    rtpSDP: |
      v=0
      o=- 0 0 IN IP4 127.0.0.1
      s=optical_flow
      c=IN IP4 127.0.0.1
      t=0 0
      m=video 5601 RTP/AVP 96
      a=rtpmap:96 H264/90000
      a=fmtp:96 packetization-mode=1

  yolo:
    source: udp+rtp://127.0.0.1:5602
    rtpSDP: |
      v=0
      o=- 0 0 IN IP4 127.0.0.1
      s=yolo
      c=IN IP4 127.0.0.1
      t=0 0
      m=video 5602 RTP/AVP 96
      a=rtpmap:96 H264/90000
      a=fmtp:96 packetization-mode=1

  bg_subtraction:
    source: udp+rtp://127.0.0.1:5603
    rtpSDP: |
      v=0
      o=- 0 0 IN IP4 127.0.0.1
      s=bg_subtraction
      c=IN IP4 127.0.0.1
      t=0 0
      m=video 5601 RTP/AVP 96
      a=rtpmap:96 H264/90000
      a=fmtp:96 packetization-mode=1

  all_others:
